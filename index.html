<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
    <script>
     document.addEventListener("DOMContentLoaded", function() {
        const cardImage = document.querySelector(".card__image");
        const cardImagesLayer = document.querySelector(".card__images-layer");

        cardImage.addEventListener("mouseover", function() {
            cardImagesLayer.style.display = "block";
        });

        cardImage.addEventListener("mouseout", function() {
            cardImagesLayer.style.display = "none";
        }); 
    });   
    </script>
</head>

<body>
    <main class=" card">

        <div class="card__images">
            <img  src="./cardImage.jpg" alt="Image 1" class="card__image">
            <img src="./view.png" alt="Image 2" class="card__images-layer">
        </div>
        <!-- <div class="card__content"> -->
            <h2 class="card__title">Equilibrium #3429</h2>
            <p class="card__description">Our Equilibrium collection promotes balance and calm.</p>
            <div class="card__time">
                <div class="card__time-left">
                    <img src="./eth.png" alt="Ethereum Icon" class="icon">
                    <p>0.041 ETH</p>
                </div>
                <div class="card__time-right">
                    <img src="./clock.png" alt="Clock Icon" class="icon">
                    <p>3 days left</p>
                </div>
            </div>
            <hr class="card__divider">
            <div class="card__creator">
                <img src="./avatar.jpg" alt="Author Avatar" class="card__author-avatar">
                <p class="card__author-name">Creation of <span class="card__author-name-highlight">Jules Wyvern</span></p>
            
        <!-- </div> -->
    </main>
    <footer>
    Challenge by <a href="https://www.crio.do" target="_blank" class="attribution">Crio.Do</a>.
     
        Coded by <a href="https://github.com/sonalbhayani" target="_blank" class="attribution">sonal bhayani</a>.</p>
</footer>
</body>

</html>
